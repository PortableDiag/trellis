[package]
name = "trellis"
version = "0.122.1"
edition = "2021"
description = "A hierarchical, spatial note-taking app: a tree of free-form canvases"
license = "MIT"
readme = "README.md"

[[bin]]
name = "trellis"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = { version = "0.29", features = ["serde"] }
emath = "0.29"
egui_extras = { version = "0.29", default-features = false, features = ["image"] }
# Charts on table cards (bar/line/scatter). Pinned to the egui 0.29 line.
egui_plot = "0.29"
# Vendored under vendor/ and patched to render inline text-color spans live.
egui_commonmark = { path = "vendor/egui_commonmark", features = ["better_syntax_highlighting"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
directories = "5"
rfd = "0.15"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
html2md = "0.2"
base64 = "0.22"
# Local calendar dates. std has no timezone support, and `time`'s now_local()
# refuses to work in a multithreaded process — which this is.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tiny_http = "0.12"
csv = "1"
calamine = "0.26"
rust_xlsxwriter = "0.79"
printpdf = "0.7"
ab_glyph = "0.2"
# Colour emoji: NotoColorEmoji is a CBDT/CBLC bitmap font, which ab_glyph cannot
# rasterize (it reads outlines only). ttf-parser reads the embedded PNGs.
ttf-parser = "0.25"
flate2 = "1"
# The agent API key comes from the OS CSPRNG. Reading /dev/urandom directly
# worked only on Unix; this asks each platform for its own generator.
getrandom = "0.3"

# Cancelling a plugin has to kill its *process group*: a plugin whose command is
# a shell script leaves the real work running as a grandchild, still holding the
# stdout pipe open, so killing only the child neither stops it nor ends the read.
# Already in the tree via getrandom/tiny_http; this makes it a direct use.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
